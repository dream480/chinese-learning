<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Chinese CHAO Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
        .chao-gradient { background: linear-gradient(135deg, #f59e0b, #ea580c); }
        .progress-smooth { transition: width 0.3s ease-out; }
        .tone-pinyin { display: none; font-size: 0.85rem; color: #ea580c; font-weight: bold; }
        .show-tone .tone-pinyin { display: block; }
    </style>
</head>
<body class="bg-slate-100 h-screen w-screen flex flex-col max-w-md mx-auto shadow-2xl overflow-hidden relative">

    <header id="app-header" class="bg-white p-4 flex flex-col gap-3 checked top-0 z-50 border-b border-slate-100 shrink-0">
        <div class="flex justify-between items-center">
            <button onclick="goHome()" class="text-slate-400 text-xl font-bold">✕</button>
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-lg">
                    <span class="text-[11px] font-bold text-slate-500">코스 설정:</span>
                    <select id="level-selector" onchange="changeLevelManual(this.value)" class="bg-transparent font-bold text-orange-600 text-xs focus:outline-none cursor-pointer">
                        <option value="3">Level 3 (여행 마스터)</option>
                        <option value="4">Level 4 (비즈니스 마스터)</option>
                    </select>
                </div>
                <span id="top-stage-badge" class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full text-[11px] font-bold">단계</span>
            </div>
            <button id="tone-toggle-btn" onclick="toggleToneView()" class="hidden bg-slate-100 border border-slate-200 px-2 py-1 rounded-lg text-xs font-bold text-slate-600">āáǎà 성조</button>
        </div>
        <div id="progress-container" class="w-full bg-slate-200 h-2 rounded-full overflow-hidden hidden">
            <div id="progress-bar" class="bg-orange-400 h-full progress-smooth" style="width: 0%"></div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-white relative">
        
        <div id="home-view" class="p-5 space-y-6">
            <div class="p-6 chao-gradient rounded-3xl text-white shadow-lg">
                <span id="dashboard-level" class="text-xs font-bold bg-white/20 px-2.5 py-1 rounded-full tracking-wider">LEVEL 3</span>
                <h2 id="dashboard-title" class="text-2xl font-black mt-2">중국어 고급 마스터 과정</h2>
                <p class="opacity-90 text-xs mt-1" id="total-progress-text">원하는 단원을 골라 자유롭게 학습하세요!</p>
            </div>
            
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider pl-1">학습 카테고리 로드맵</h3>
            
            <div id="roadmap-container" class="space-y-6 pb-12"></div>
        </div>

        <div id="lesson-view" class="hidden p-5 space-y-6 pb-24">
            <div id="quest-guide-text" class="text-sm text-slate-400 font-bold">빈칸에 알맞은 것을 고르시오</div>

            <div id="graphic-area" class="w-full h-40 bg-orange-50 rounded-2xl overflow-hidden flex flex-col items-center justify-center border border-slate-100 relative p-3">
                <div id="graphic-icon" class="text-6xl mb-1">🧳</div>
                <div id="graphic-desc" class="text-xs font-bold text-slate-400">Illustration</div>
            </div>

            <div id="main-text-frame" class="text-center space-y-2">
                <div class="tone-pinyin id-pinyin-display"></div>
                <div class="flex items-center justify-center gap-3">
                    <h2 id="target-chinese" class="text-3xl font-bold tracking-wide text-slate-800">중국어 한자</h2>
                    <button onclick="playCurrentQuestionAudio()" class="w-10 h-10 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center text-lg active:scale-90 shadow-sm transition">🔊</button>
                </div>
                <p id="target-translation" class="text-base text-slate-400 font-medium">한국어 해석</p>
            </div>

            <div id="interaction-area" class="min-h-[160px] pt-2"></div>
        </div>
    </main>

    <footer id="footer-action" class="hidden p-4 bg-white border-t border-slate-100 sticky bottom-0 z-40 shrink-0">
        <button id="next-btn" class="w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold text-lg active:scale-[0.99] transition shadow-md">계속하기</button>
    </footer>

    <div id="result-sheet" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t-2 rounded-t-3xl p-5 shadow-2xl z-50 transform translate-y-100 hidden">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <div id="sheet-icon" class="w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold"></div>
                <div>
                    <h4 id="sheet-title" class="font-bold text-lg">결과</h4>
                    <p id="sheet-subtitle" class="text-xs text-slate-400"></p>
                </div>
            </div>
            <button id="sheet-audio-btn" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center">🔊</button>
        </div>
        <button id="sheet-next-btn" class="w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold text-lg">계속하기</button>
    </div>

    <script>
        const stageConfig = [
            { id: 'voca', total: 20, label: '어휘 학습 (20문)' },
            { id: 'grammar', total: 20, label: '문법 마스터 (20문)' },
            { id: 'roleplay', total: 15, label: '본문 롤플레잉 (15문)' },
            { id: 'quiz', total: 15, label: '실전 리뷰 퀴즈 (15문)' },
            { id: 'ai-chat', total: 1, label: 'AI 동적 프리토킹' }
        ];

        const initialLevelData = {
            3: [
                { id: 0, title: "🧳 1. 여행 준비", doneStages: [] },
                { id: 1, title: "✈️ 2. 공항과 기내", doneStages: [] },
                { id: 2, title: "🏨 3. 호텔 체크인", doneStages: [] },
                { id: 3, title: "🍽️ 4. 식당과 주문", doneStages: [] },
                { id: 4, title: "🚇 5. 교통과 이동", doneStages: [] },
                { id: 5, title: "🛍️ 6. 쇼핑과 환불", doneStages: [] },
                { id: 6, title: "🗺️ 7. 길 찾기 관광", doneStages: [] },
                { id: 7, title: "☕ 8. 카페와 대화", doneStages: [] },
                { id: 8, title: "🏥 9. 약국과 병원", doneStages: [] },
                { id: 9, title: "📞 10. 전화와 소통", doneStages: [] },
                { id: 10, title: "🎉 11. 축하와 모임", doneStages: [] },
                { id: 11, title: "💼 12. 비즈니스 업무", doneStages: [] }
            ],
            4: [
                { id: 0, title: "🏢 1. 출장 및 공항 픽업", doneStages: [] },
                { id: 1, title: "🤝 2. 비즈니스 첫 미팅", doneStages: [] },
                { id: 2, title: "📞 3. 일정 조정 및 통화", doneStages: [] },
                { id: 3, title: "📊 4. 회사 및 제품 소개", doneStages: [] },
                { id: 4, title: "📜 5. 계약 조건 협상", doneStages: [] },
                { id: 5, title: "🍷 6. 비즈니스 만찬", doneStages: [] },
                { id: 6, title: "📈 7. 시장 조사 및 방문", doneStages: [] },
                { id: 7, title: "🛠️ 8. 문제 해결 및 컴플레인", doneStages: [] },
                { id: 8, title: "🏦 9. 대금 결제 및 송금", doneStages: [] },
                { id: 9, title: "📦 10. 통관 및 물류 배송", doneStages: [] },
                { id: 10, title: "🙋 11. 전시회 및 바이어 응대", doneStages: [] },
                { id: 11, title: "👋 12. 환송 및 파트너십 구축", doneStages: [] }
            ]
        };

        const aiTalkingTopics = {
            3: {
                0: { zh: "你好！听说你准备去中国旅游，行李箱 🧳 准备好了吗？里面放了护照吗？", ko: "안녕하세요! 중국 여행을 준비 중이시라는데 캐리어는 다 싸셨나요? 안에 여권은 넣으셨고요?" },
                1: { zh: "先生, 请问您要换机票吗？您的行李托运好了吗？", ko: "손님, 비행기표를 변경하시겠습니까? 수하물 위탁은 끝나셨나요?" },
                2: { zh: "欢迎光临酒店！请问您有预订房间吗？出示一下护照。", ko: "호텔에 오신 것을 환영합니다! 예약하셨나요? 여권을 보여주세요." },
                3: { zh: "服务员！你想吃点什么？我们店的饺子和烤鸭非常有名。", ko: "여기요! 무엇을 드시겠습니까? 저희 가게는 만두와 베이징 덕이 유명합니다." },
                4: { zh: "去北京站应该坐地铁还是坐公共汽车更快呢？", ko: "베이징역에 가려면 지하철을 타는 게 빠를까요, 버스를 타는 게 빠를까요?" },
                5: { zh: "这件衣服太贵了，能不能便宜一点儿？", ko: "이 옷은 너무 비싸네요, 조금만 깎아주실 수 있나요?" },
                6: { zh: "请问，去故宫博物馆应该怎么走？我迷路了。", ko: "말씀 좀 묻겠습니다, 고궁 박물관에 가려면 어떻게 가야 하나요? 길을 잃었어요." },
                7: { zh: "这家咖啡厅的环境真漂亮，你想喝咖啡还是中国茶？", ko: "이 카페 분위기가 정말 예쁘네요, 커피를 드시겠어요, 중국 차를 드시겠어요?" },
                8: { zh: "我觉得身体不舒服，头疼发烧。请问附近有药店吗？", ko: "몸이 안 좋은 것 같아요, 머리가 아프고 열이 나요. 근처에 약국이 있나요?" },
                9: { zh: "喂？请问张华在吗？我想跟他约明天见面。", ko: "여보세요? 장화 씨 계신가요? 내일 만날 약속을 잡고 싶어서요." },
                10: { zh: "祝你生日快乐！今天的生日聚会你开心吗？", ko: "생일 축하해요! 오늘 생일 파티는 즐거우신가요?" },
                11: { zh: "下周你要去上海出差，商务行程安排好了吗？", ko: "다음 주에 상하이로 출장을 가시는데, 비즈니스 일정은 다 잡으셨나요?" }
            },
            4: {
                0: { zh: "您好，我是中国公司的王经理。非常荣幸来机场接您，一路上出差辛苦了！", ko: "안녕하세요, 중국 회사의 왕 매니저입니다. 공항에 마중 나오게 되어 영광입니다, 오시는 길 고생 많으셨습니다!" },
                1: { zh: "张经理，很高兴能和贵公司进行第一次会议。请问怎么称呼您？", ko: "장 매니저님, 귀사와의 첫 미팅을 가지게 되어 기쁩니다. 성함은 어떻게 되시나요?" },
                2: { zh: "关于明天的谈判时间，因为日程有变动，我们可以换个时间吗？", ko: "내일 협상 시간과 관련하여 일정에 변동이 생겼는데, 시간을 바꿀 수 있을까요?" },
                3: { zh: "接下来由我来介绍一下我们公司最新研发的核心产品。", ko: "이어서 저희 회사가 최근에 개발한 핵심 제품에 대해 소개해 드리겠습니다." },
                4: { zh: "这个合同的条件我们希望修改，关于价格能不能再让步一点？", ko: "이 계약서의 조건을 수정하고 싶습니다, 가격 면에서 조금 더 양보해 줄 수 있나요?" },
                5: { zh: "非常感谢今晚的盛情款待！让我们为了以后的合作干杯！", ko: "오늘 밤 성대한 만찬 대접에 정말 감사드립니다! 향후 협력을 위해 건배합시다!" },
                6: { zh: "这次来中国市场调查，您觉得有哪些主要的发展前景？", ko: "이번에 중국 시장 조사를 오셔서 보시기에 어떤 주요 발전 전망이 있어 보이나요?" },
                7: { zh: "十分抱歉，这次产品出现了质量缺陷，我们会立刻进行修复和解决。", ko: "정말 죄송합니다, 이번 제품에 품질 결함이 발생했습니다. 즉시 수정하고 해결하겠습니다." },
                8: { zh: "关于这次货物的款项，贵公司打算用人民币还是美金进行汇款？", ko: "이번 화물 대금과 관련하여, 귀사는 위안화와 달러 중 어느 것으로 송금하실 계획인가요?" },
                9: { zh: "由于海关通关流程变严，货物的物流配送可能会延迟几天。", ko: "세관 통관 절차가 까다로워져 화물 물류 배송이 며칠 지연될 수 있습니다." },
                10: { zh: "欢迎光临我们的展位！请问您对哪一类别的商机和商品感兴趣？", ko: "저희 부스에 오신 것을 환영합니다! 어떤 카테고리의 비즈니스 기회와 상품에 관심이 있으신가요?" },
                11: { zh: "感谢这几天的配合，希望我们未来能建立长期的战略合作关系。祝您一路平安！", ko: "며칠 동안의 협조에 감사드립니다, 우리가 향후 장기적인 전략적 협력 관계를 구축하길 바랍니다. 조심히 돌아가세요!" }
            }
        };

        let fullDatabase = JSON.parse(localStorage.getItem('chao_pro_multilevel_db')) || initialLevelData;
        let currentLevel = 3;
        let activeCatId = 0;
        let currentStageId = 'voca';
        let stepIndex = 0;
        let selectedOption = null;
        let showTone = false;
        let audioTargetString = "";
        let chatHistory = [];
        let speechRecognizerInstance = null; 

        const vocabularyPool = {
            3: [
                { zh: "行李箱", py: "xínglǐxiāng", ko: "여행가방", emoji: "🧳" },
                { zh: "护照", py: "hùzhào", ko: "여권", emoji: "🛂" },
                { zh: "机票", py: "jīpiào", ko: "비행기표", emoji: "🎫" },
                { zh: "地图", py: "dìtú", ko: "지도", emoji: "🗺️" },
                { zh: "相机", py: "xiàngjī", ko: "카메라", emoji: "📷" },
                { zh: "酒店", py: "jiǔdiàn", ko: "호텔", emoji: "🏨" },
                { zh: "现金", py: "xiànjīn", ko: "현금", emoji: "💵" },
                { zh: "衣服", py: "yīfu", ko: "옷", emoji: "👔" }
            ],
            4: [
                { zh: "出差", py: "chūchāi", ko: "출장", emoji: "💼" },
                { zh: "合同", py: "hétong", ko: "계약서", emoji: "📜" },
                { zh: "会议", py: "huìyì", ko: "비즈니스 회의", emoji: "📊" },
                { zh: "谈判", py: "tánpàn", ko: "비즈니스 협상", emoji: "🤝" },
                { zh: "公司", py: "gōngsī", ko: "회사", emoji: "🏢" },
                { zh: "经理", py: "jīnglǐ", ko: "매니저/부장", emoji: "🧑‍💼" },
                { zh: "合作", py: "hézuò", ko: "협력/파트너십", emoji: "🤛" },
                { zh: "产品", py: "chǎnpǐn", ko: "제품/상품", emoji: "📦" }
            ]
        };

        let localizedVocaList = [];
        function shuffleSessionVocabulary() {
            const origin = vocabularyPool[currentLevel];
            localizedVocaList = [...origin].sort(() => Math.random() - 0.5);
        }

        function initChatHistory() {
            const topic = aiTalkingTopics[currentLevel][activeCatId] || { zh: "你好！", ko: "안녕하세요!" };
            chatHistory = [{ role: 'assistant', zh: topic.zh, ko: topic.ko }];
        }

        function saveProgress() {
            localStorage.setItem('chao_pro_multilevel_db', JSON.stringify(fullDatabase));
        }

        function changeLevelManual(targetLvl) {
            currentLevel = parseInt(targetLvl);
            goHome();
        }

        function goHome() {
            if(speechRecognizerInstance) { try { speechRecognizerInstance.stop(); } catch(e){} }
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('lesson-view').classList.add('hidden');
            document.getElementById('footer-action').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
            document.getElementById('result-sheet').classList.add('hidden');
            document.getElementById('tone-toggle-btn').classList.add('hidden');
            
            document.getElementById('level-selector').value = currentLevel;
            document.getElementById('dashboard-level').innerText = `LEVEL ${currentLevel}`;
            document.getElementById('dashboard-title').innerText = currentLevel === 3 ? "여행 중국어 회화 코스" : "비즈니스 스피킹 마스터 코스";
            
            renderRoadmapDashboard();
        }

        function renderRoadmapDashboard() {
            const container = document.getElementById('roadmap-container');
            container.innerHTML = '';
            const cats = fullDatabase[currentLevel];

            let clearedCount = cats.filter(c => c.doneStages.length === 5).length;
            document.getElementById('total-progress-text').innerText = `총 12개 카테고리 중 ${clearedCount}개 단원 완료!`;

            cats.forEach((cat) => {
                const catCard = document.createElement('div');
                catCard.className = 'p-4 border rounded-2xl shadow-sm transition bg-white border-orange-200';
                
                let stageButtonsHtml = `<div class="grid grid-cols-1 gap-2 mt-3 pt-3 border-t border-slate-100">`;
                stageConfig.forEach(stg => {
                    const isStageCleared = cat.doneStages.includes(stg.id);
                    
                    stageButtonsHtml += `
                        <button onclick="launchStageAction(${cat.id}, '${stg.id}')" 
                            class="w-full text-left p-2.5 text-xs font-bold rounded-xl flex justify-between items-center transition
                            ${isStageCleared ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-orange-50/60 text-slate-700 border border-orange-100 hover:border-orange-400'}">
                            <span>${stg.label}</span>
                            <span class="text-[10px] font-bold ${isStageCleared ? 'text-emerald-600' : 'text-orange-500'}">
                                ${isStageCleared ? '✅ 완료 (복습)' : '⚡ 학습하기'}
                            </span>
                        </button>
                    `;
                });
                stageButtonsHtml += `</div>`;

                catCard.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-base font-extrabold text-slate-800">${cat.title}</span>
                        <span class="text-xs font-bold ${cat.doneStages.length === 5 ? 'text-emerald-500' : 'text-amber-500'}">
                            ${cat.doneStages.length === 5 ? '🏆 마스터' : '📖 학습가능'}
                        </span>
                    </div>
                    ${stageButtonsHtml}
                `;
                container.appendChild(catCard);
            });
        }

        function launchStageAction(catId, stageId) {
            activeCatId = catId;
            currentStageId = stageId;
            stepIndex = 0;
            
            shuffleSessionVocabulary();
            if(stageId === 'ai-chat') initChatHistory(); 

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('lesson-view').classList.remove('hidden');
            document.getElementById('footer-action').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            document.getElementById('top-stage-badge').innerText = stageConfig.find(s => s.id === stageId).label.split(' ')[0];
            
            if(stageId === 'roleplay') document.getElementById('tone-toggle-btn').classList.remove('hidden');
            compileStepEngine();
        }

        function compileStepEngine() {
            let totalMax = (currentStageId === 'voca' || currentStageId === 'grammar') ? 20 : 15;
            if(currentStageId === 'ai-chat') totalMax = 1;

            document.getElementById('progress-bar').style.width = `${(stepIndex / totalMax) * 100}%`;
            document.getElementById('result-sheet').classList.add('hidden');

            const area = document.getElementById('interaction-area');
            const gIcon = document.getElementById('graphic-icon');
            const gDesc = document.getElementById('graphic-desc');
            const zhText = document.getElementById('target-chinese');
            const koText = document.getElementById('target-translation');
            const pinyinDisplay = document.querySelector('.id-pinyin-display');
            
            area.innerHTML = '';
            selectedOption = null;

            const nextBtn = document.getElementById('next-btn');
            nextBtn.className = "w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold text-lg shadow-md";
            nextBtn.innerText = "확인하기";

            const v = localizedVocaList[stepIndex % localizedVocaList.length];
            const getDistractors = (correct, list) => {
                return [correct, ...list.filter(item => item.zh !== correct).map(item => item.zh).slice(0, 3)];
            };

            if(currentStageId === 'voca') {
                const subType = stepIndex % 3;
                if(subType === 0) {
                    document.getElementById('quest-guide-text').innerText = "올바른 답을 고르시오";
                    gIcon.innerText = v.emoji; gDesc.innerText = "어휘 매칭";
                    zhText.innerText = "(  )"; koText.innerText = v.ko; pinyinDisplay.innerText = "";
                    audioTargetString = v.zh; 
                    renderSelectionButtons(getDistractors(v.zh, localizedVocaList), v.zh, 'voca');
                } else if(subType === 1) {
                    document.getElementById('quest-guide-text').innerText = "녹음을 듣고, 알맞은 단어를 고르세요";
                    gIcon.innerText = "🔊"; gDesc.innerText = "청취 훈련";
                    zhText.innerText = "(  )"; koText.innerText = "소리를 매칭하세요"; pinyinDisplay.innerText = "";
                    audioTargetString = v.zh;
                    renderSelectionButtons(getDistractors(v.zh, localizedVocaList), v.zh, 'voca');
                } else {
                    document.getElementById('quest-guide-text').innerText = "단어를 선택하여 빈칸을 채우시오";
                    gIcon.innerText = "📝"; gDesc.innerText = "문맥 응용";
                    if(currentLevel === 3) {
                        zhText.innerText = `我把 (  ) 准备好了。`; koText.innerText = `나는 ${v.ko}을(를) 준비 완료했습니다.`;
                        audioTargetString = `我把${v.zh}准备好了。`;
                    } else {
                        zhText.innerText = `我们要讨论 (  ) 内容。`; koText.innerText = `우리는 ${v.ko} 내용을 토론해야 합니다.`;
                        audioTargetString = `我们要讨论${v.zh}内容。`;
                    }
                    pinyinDisplay.innerText = "";
                    renderSelectionButtons(getDistractors(v.zh, localizedVocaList), v.zh, 'voca');
                }
                nextBtn.onclick = verifyStandardSelect;

            } else if(currentStageId === 'grammar') {
                document.getElementById('quest-guide-text').innerText = "빈칸에 알맞은 것을 고르시오";
                const gType = stepIndex % 3;
                gIcon.innerText = "🎯"; gDesc.innerText = "문법 패턴";
                
                if(currentLevel === 3) {
                    if(gType === 0) {
                        zhText.innerText = `这是我 (  ) 行李箱。`; koText.innerText = "이것은 저의 여행가방입니다."; audioTargetString = "这是我的行李箱。";
                        renderSelectionButtons(["的", "得", "地", "了"], "의", 'grammar', `这是我 (  ) 行李箱。`);
                    } else if(gType === 1) {
                        zhText.innerText = `我们去买机票 (  )。`; koText.innerText = "우리 비행기표 사러 가자."; audioTargetString = "我们去买机票吧。";
                        renderSelectionButtons(["吧", "吗", "呢", "啊"], "吧", 'grammar', `我们去买机票 (  )。`);
                    } else {
                        zhText.innerText = `我 (  ) 护照 带来了。`; koText.innerText = "나는 여권을 챙겨왔어."; audioTargetString = "我把护照带来了。";
                        renderSelectionButtons(["把", "反", "在", "给"], "把", 'grammar', `我 (  ) 护照 带来了。`);
                    }
                } else {
                    if(gType === 0) {
                        zhText.innerText = `关于这次会议，我 (  ) 想法。`; koText.innerText = "이번 회의에 관해서 저는 의견이 없습니다."; audioTargetString = "关于这次会议，我没有想法。";
                        renderSelectionButtons(["没有", "不", "别", "未"], "没有", 'grammar', `关于这次会议，我 (  ) 想法。`);
                    } else if(gType === 1) {
                        zhText.innerText = `请 𡈡 仔细看 (  ) 合同。`; koText.innerText = "이 계약서를 좀 자세히 읽어 주십시오."; audioTargetString = "请您仔细看看合同。";
                        renderSelectionButtons(["看看", "看了", "看见", "看完"], "看看", 'grammar', `请您仔细看 (  ) 合同。`);
                    } else {
                        zhText.innerText = `我们 (  ) 建立合作关系。`; koText.innerText = "우리는 협력 관계를 구축하고 싶습니다."; audioTargetString = "我们希望建立合作关系。";
                        renderSelectionButtons(["希望", "需要", "打算", "应该"], "希望", 'grammar', `我们 (  ) 建立合作关系。`);
                    }
                }
                pinyinDisplay.innerText = "";
                nextBtn.onclick = verifyStandardSelect;

            } else if(currentStageId === 'roleplay') {
                document.getElementById('quest-guide-text').innerText = "듣고 따라 발음해보세요 (CHAO AI강화)";
                gIcon.innerText = "👥"; gDesc.innerText = `롤플레잉 (${stepIndex+1}/15)`;
                
                const scriptSet = {
                    3: [
                        { zh: "我想去中国旅游。", py: "wǒ xiǎng qù zhōng guó lǚ yóu", ko: "저는 중국 여행에 가고 싶어요." },
                        { zh: "你准备好护照了吗？", py: "nǐ zhǔn bèi hǎo hù zhào le ma", ko: "여권은 준비되셨나요?" },
                        { zh: "护照放在行李箱里了。", py: "hù zhào fàng zài xíng lǐ xiāng lǐ le", ko: "여권은 여행 가방 안에 넣어두었습니다." }
                    ],
                    4: [
                        { zh: "这次出差非常重要。", py: "zhè cì chū chāi fēi cháng zhòng yào", ko: "이번 출장은 매우 중요합니다." },
                        { zh: "我们需要签这个合同。", py: "wǒ men xū yào qiān zhè ge hé tong", ko: "우리는 이 계약서에 서명해야 합니다." },
                        { zh: "下午两点举行会议。", py: "xià wǔ liǎng diǎn jǔ xíng huì yì", ko: "오후 2시에 회의를 거행합니다." }
                    ]
                };
                
                const rpScript = [...scriptSet[currentLevel]].sort(() => Math.random() - 0.5);
                const currentLine = rpScript[stepIndex % rpScript.length];
                
                zhText.innerText = currentLine.zh; koText.innerText = currentLine.ko; pinyinDisplay.innerText = currentLine.py;
                audioTargetString = currentLine.zh;
                nextBtn.innerText = "🎙️ 발음 시작하기 (따라 말하기)";
                nextBtn.onclick = triggerSpeechAnalysis;

            } else if(currentStageId === 'quiz') {
                document.getElementById('quest-guide-text').innerText = "빈칸에 알맞은 것을 고르시오 (복습)";
                gIcon.innerText = "💯"; gDesc.innerText = "종합 리뷰";
                
                if(currentLevel === 3) {
                    if(stepIndex % 2 === 0) {
                        zhText.innerText = "去中国旅游需要 (  )。"; koText.innerText = "중국 여행을 가려면 여권이 필요해."; audioTargetString = "去中国旅游需要护照。";
                        renderSelectionButtons(["护照", "相机", "衣服", "酒店"], "护照", 'voca');
                    } else {
                        zhText.innerText = "我们 (  ) 酒店 预订好了。"; koText.innerText = "우리는 호텔 예약을 완료했어."; audioTargetString = "我们把酒店预订好了。";
                        renderSelectionButtons(["把", "的", "吧", "了"], "把", 'voca');
                    }
                } else {
                    if(stepIndex % 2 === 0) {
                        zhText.innerText = "请签一下这个 (  )。"; koText.innerText = "이 계약서에 서명해 주세요."; audioTargetString = "请签一下这个合同。";
                        renderSelectionButtons(["合同", "会议", "出差", "谈判"], "合同", 'voca');
                    } else {
                        zhText.innerText = "关于这次会议，我 (  ) 意见。"; koText.innerText = "이번 회의에 대해 저는 이견이 없습니다."; audioTargetString = "关于这次会议，我没有意见。";
                        renderSelectionButtons(["调整", "不", "别", "完"], "没有", 'voca');
                    }
                }
                pinyinDisplay.innerText = "";
                nextBtn.onclick = verifyStandardSelect;

            } else if(currentStageId === 'ai-chat') {
                document.getElementById('quest-guide-text').innerText = "AI 선생님의 말을 듣고 대답하세요 (자유 대화)";
                gIcon.innerText = "🤖"; gDesc.innerText = "카테고리 매칭 프리토킹";
                const currentAiTurn = chatHistory[chatHistory.length-1];
                zhText.innerText = currentAiTurn.zh; koText.innerText = currentAiTurn.ko; pinyinDisplay.innerText = "";
                audioTargetString = currentAiTurn.zh;

                const chatBox = document.createElement('div');
                chatBox.className = "w-full space-y-3 bg-slate-50 p-3 rounded-2xl max-h-[180px] overflow-y-auto mb-3 text-xs shadow-inner";
                chatHistory.forEach(msg => {
                    const isAi = msg.role === 'assistant';
                    chatBox.innerHTML += `<div class="${isAi ? 'text-left' : 'text-right'}"><span class="inline-block px-3 py-2 rounded-xl max-w-[80%] ${isAi ? 'bg-orange-100 text-orange-800' : 'bg-emerald-500 text-white'}"><strong>${isAi ? 'AI' : '나'}:</strong> ${msg.zh}<br><small class="opacity-70">${msg.ko}</small></span></div>`;
                });
                area.appendChild(chatBox);
                setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50);
                
                nextBtn.innerText = "🎙️ 대답 시작하기 (녹음 개시)";
                nextBtn.className = "w-full py-4 bg-orange-500 text-white rounded-2xl font-bold text-lg shadow-md";
                nextBtn.onclick = startManualVoiceRecording;
            }

            setTimeout(() => {
                if (currentStageId === 'voca' && stepIndex % 3 === 1) {
                    runInternalTTS(v.zh);
                } else {
                    playCurrentQuestionAudio();
                }
            }, 350);
        }

        function playCurrentQuestionAudio() { if(audioTargetString) runInternalTTS(audioTargetString); }

        function renderSelectionButtons(opts, correctAns, type, previewText = '') {
            const area = document.getElementById('interaction-area');
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-2 gap-3 w-full";
            const shuffled = [...opts].sort(() => Math.random() - 0.5);
            shuffled.forEach(o => {
                const btn = document.createElement('button');
                btn.className = "p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700 transition active:bg-orange-50";
                btn.innerText = o;
                btn.onclick = () => {
                    Array.from(grid.children).forEach(b => b.className = "p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm text-slate-700");
                    btn.className = "p-3.5 bg-emerald-50 border-2 border-emerald-500 rounded-xl font-bold text-emerald-600";
                    selectedOption = { user: o, correct: correctAns };
                    if (type === 'grammar') document.getElementById('target-chinese').innerHTML = previewText.replace('(  )', `<span class="text-emerald-600 font-extrabold underline">${o}</span>`);
                };
                grid.appendChild(btn);
            });
            area.appendChild(grid);
        }

        function verifyStandardSelect() {
            if(!selectedOption) return alert('보기를 선택하세요!');
            launchResultPopSheet(selectedOption.user === selectedOption.correct ? 100 : 0);
        }

        function runInternalTTS(text) {
            if('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = 'zh-CN';
                window.speechSynthesis.speak(ut);
            }
        }

        function triggerSpeechAnalysis() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return alert('녹음 기능 미지원 환경');
            const rec = new SpeechRecognition(); rec.lang = 'zh-CN';
            rec.start();
            rec.onresult = (e) => { launchResultPopSheet(90, e.results[0][0].transcript); };
        }

        function startManualVoiceRecording() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!SpeechRecognition) return alert('음성 인식 기능이 허용되지 않는 브라우저입니다.');

            speechRecognizerInstance = new SpeechRecognition();
            speechRecognizerInstance.lang = 'zh-CN';
            speechRecognizerInstance.continuous = true; 
            speechRecognizerInstance.interimResults = false;

            let finalTranscriptAccumulator = "";

            speechRecognizerInstance.onresult = (e) => {
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        finalTranscriptAccumulator += e.results[i][0].transcript;
                    }
                }
            };

            speechRecognizerInstance.start();

            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = "⏹️ 대답 끝내기 (녹음 완료 및 전송)";
            nextBtn.className = "w-full py-4 bg-red-600 text-white rounded-2xl font-bold text-lg shadow-lg animate-pulse";
            
            nextBtn.onclick = function() {
                if(speechRecognizerInstance) {
                    speechRecognizerInstance.stop(); 
                    
                    setTimeout(() => {
                        processAiNextDialogueTurn(finalTranscriptAccumulator || "내 발음 체크 완료");
                    }, 400);
                }
            };
        }

        function processAiNextDialogueTurn(userSpeech) {
            let replyZh = "明白。那我们接下来怎么做呢？继续深入探讨一下吧！";
            let replyKo = "알겠습니다. 그럼 우리 다음으로 무엇을 해볼까요? 계속해서 깊게 이야기 나눠봐요!";

            if(currentLevel === 3) {
                if(userSpeech.includes("没") || userSpeech.includes("不")) {
                    replyZh = "没关系，多练习几次就好。你还打算买别的旅游准备物吗？";
                    replyKo = "괜찮아요, 몇 번 더 연습하면 됩니다. 또 다른 여행 준비물을 구매하실 계획인가요?";
                } else {
                    replyZh = "太好了！祝你一切顺利。到了目的地记得通知我。";
                    replyKo = "정말 좋네요! 모든 일이 순조롭길 바랍니다. 목적지에 도착하면 저에게 알려주세요.";
                }
            } else {
                if(userSpeech.includes("钱") || userSpeech.includes("价格") || userSpeech.includes("合同")) {
                    replyZh = "关于合同的金额和细节，我们可以在明天的会议上仔细研究。";
                    replyKo = "계약서의 금액과 세부 사항에 대해서는 내일 회의에서 자세히 검토할 수 있습니다.";
                } else {
                    replyZh = "好的, 预祝我们的商业项目取得巨大成功，合作愉快！";
                    replyKo = "좋습니다, 우리의 비즈니스 프로젝트가 큰 성공을 거두길 기원하며, 즐거운 협력이 되길 바랍니다!";
                }
            }

            chatHistory.push({ role: 'user', zh: userSpeech, ko: `(내 답변 수동정지 전송): ${userSpeech}` });
            chatHistory.push({ role: 'assistant', zh: replyZh, ko: replyKo });

            compileStepEngine();
        }

        function launchResultPopSheet(score, transcript = '') {
            const sheet = document.getElementById('result-sheet');
            const title = document.getElementById('sheet-title');
            const icon = document.getElementById('sheet-icon');
            const sBtn = document.getElementById('sheet-next-btn');
            sheet.classList.remove('hidden'); sheet.classList.add('sheet-up');

            if(score >= 60) {
                title.innerText = "정답입니다!"; title.className = "font-bold text-lg text-emerald-600";
                icon.innerText = "✓"; icon.className = "w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold";
                sBtn.onclick = handleStageProgressionStep;
            } else {
                title.innerText = "다시 시도해 보세요"; title.className = "font-bold text-lg text-red-500";
                icon.innerText = "✕"; icon.className = "w-10 h-10 rounded-full bg-red-100 text-red-500 flex items-center justify-center text-xl font-bold";
                sBtn.onclick = () => { sheet.classList.add('hidden'); compileStepEngine(); };
            }
        }

        function handleStageProgressionStep() {
            let totalMax = (currentStageId === 'voca' || currentStageId === 'grammar') ? 20 : 15;
            if(currentStageId === 'ai-chat') totalMax = 1;

            if(stepIndex < totalMax - 1) {
                stepIndex++;
                compileStepEngine();
            } else {
                const cats = fullDatabase[currentLevel];
                if (!cats[activeCatId].doneStages.includes(currentStageId)) {
                    cats[activeCatId].doneStages.push(currentStageId);
                }
                saveProgress();
                goHome();
            }
        }

        window.onload = goHome;
    </script>
</body>
</html>
